[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeonhub-cli"
dynamic = ["version"]
description = "PigeonHub command-line job lifecycle client"
requires-python = ">=3.10"
dependencies = ["qrcode[pil]>=7.4,<9"]

[tool.setuptools.dynamic]
version = { attr = "pigeonhub.__version__" }

[project.scripts]
pigeonhub = "pigeonhub.cli:main"

[tool.setuptools.packages.find]
include = ["pigeonhub*"]
